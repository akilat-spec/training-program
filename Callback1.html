<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <script>
          function greetUser(name,callback)
          {
            console.log("Hai "+name+",Welcome To Callback Function");
            callback();
          }
          function sayBye()
          {
            console.log("Bye!");
          }
          greetUser("Jack",sayBye);
      </script>
</body>
</html>
